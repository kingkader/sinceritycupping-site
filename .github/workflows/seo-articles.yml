name: Publish SEO articles three times weekly

on:
  schedule:
    - cron: "30 6 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate scheduled wet cupping article (Mon/Wed/Fri)
        run: node scripts/generate-articles.mjs --count=1

      - name: Validate site
        run: node scripts/check-site.mjs

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Publish scheduled wet cupping SEO article"
          file_pattern: "articles/** blog/index.html sitemap.xml llms.txt data/article-manifest.json"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sinceritycupping --branch=main --commit-dirty=true
