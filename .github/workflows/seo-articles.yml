name: Validate static articles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test committed content
        run: npm test

      - name: Build allowlisted public site
        run: npm run build

      - name: Validate built site
        run: npm run check:dist

      - name: Confirm validation did not edit tracked files
        run: git diff --exit-code
