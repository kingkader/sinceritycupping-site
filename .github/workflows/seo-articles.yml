name: Validate static articles

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinceritycupping-production
  cancel-in-progress: false

jobs:
  validate-static-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Test committed content
        run: npm test

      - name: Build allowlisted public site
        run: npm run build

      - name: Validate built site
        run: npm run check:dist

      - name: Confirm validation did not edit tracked files
        run: git diff --exit-code
