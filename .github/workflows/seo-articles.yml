name: Validate reviewed SEO articles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reviewed-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rerender reviewed articles
        run: npm run rerender:articles

      - name: Confirm rerender is deterministic
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi

      - name: Validate site
        run: npm run check:source
